<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E07A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A1E"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B6B4F"/>
      <stop offset="100%" stop-color="#0A3326"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7E07A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Decorative outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2 4" opacity="0.7"/>

  <!-- 8-pointed star (Islamic ornament) -->
  <g transform="translate(100,100)" opacity="0.15" fill="url(#goldGrad)">
    <path d="M0,-70 L15,-15 L70,0 L15,15 L0,70 L-15,15 L-70,0 L-15,-15 Z"/>
    <path d="M0,-70 L15,-15 L70,0 L15,15 L0,70 L-15,15 L-70,0 L-15,-15 Z" transform="rotate(45)"/>
  </g>

  <!-- Glow behind book -->
  <circle cx="100" cy="100" r="55" fill="url(#glowGrad)"/>

  <!-- Open book (kitab) -->
  <g filter="url(#softShadow)">
    <!-- Left page -->
    <path d="M50,105 Q75,90 100,100 L100,140 Q75,130 50,140 Z" fill="#F5E6C3" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Right page -->
    <path d="M150,105 Q125,90 100,100 L100,140 Q125,130 150,140 Z" fill="#F5E6C3" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Center spine -->
    <line x1="100" y1="100" x2="100" y2="140" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Text lines on left page -->
    <line x1="60" y1="110" x2="90" y2="106" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="60" y1="116" x2="92" y2="112" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="60" y1="122" x2="88" y2="118" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="60" y1="128" x2="90" y2="124" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>

    <!-- Text lines on right page -->
    <line x1="110" y1="106" x2="140" y2="110" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="108" y1="112" x2="140" y2="116" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="112" y1="118" x2="140" y2="122" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
    <line x1="110" y1="124" x2="140" y2="128" stroke="#9C7A1E" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Arabic calligraphy "مناقشة" at top -->
  <g transform="translate(100,55)">
    <text x="0" y="0" font-family="'Traditional Arabic','Scheherazade New',serif" font-size="28" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">مناقشة</text>
  </g>

  <!-- Small star ornaments -->
  <g fill="url(#goldGrad)">
    <path d="M30,30 L33,37 L40,40 L33,43 L30,50 L27,43 L20,40 L27,37 Z"/>
    <path d="M170,30 L173,37 L180,40 L173,43 L170,50 L167,43 L160,40 L167,37 Z"/>
    <path d="M30,170 L33,177 L40,180 L33,183 L30,190 L27,183 L20,180 L27,177 Z"/>
    <path d="M170,170 L173,177 L180,180 L173,183 L170,190 L167,183 L160,180 L167,177 Z"/>
  </g>

  <!-- Bottom text "MUNAQOSYAH" -->
  <text x="100" y="170" font-family="'Trajan Pro',serif" font-size="11" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3" font-weight="bold">MUNAQOSYAH</text>
</svg>

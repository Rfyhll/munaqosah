    <path d="M256 32 L296 168 L432 168 L322 252 L362 388 L256 304 L150 388 L190 252 L80 168 L216 168 Z"/>
    <path d="M256 32 L296 168 L432 168 L322 252 L362 388 L256 304 L150 388 L190 252 L80 168 L216 168 Z" transform="rotate(45 256 256)"/>
  </g>

  <!-- White inner background -->
